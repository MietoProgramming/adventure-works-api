# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: air_lines_db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
